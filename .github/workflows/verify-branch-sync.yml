name: Verify Branch Sync & Protocol Compliance

on:
  pull_request:
    branches: [ main ]

jobs:
  check-sync:
    name: Verify PR is Synced with Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is behind main
        run: |
          git fetch origin main
          BEHIND_COUNT=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "⚠️ WARNING: This branch is behind origin/main by $BEHIND_COUNT commit(s)."
            echo "👉 To fix: Merge main into your branch: git merge origin/main"
            echo "👉 Ensure your pre-push hook is active: git config core.hooksPath .githooks (or run scripts/setup.sh)"
          else
            echo "✅ Branch is fully up-to-date with main!"
          fi
