name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ReliefOps ${{ github.ref_name }} — Live App
          draft: false
          prerelease: false
          body: |
            ## 🛡️ ReliefOps: Shared Operations Hub for Furikomi Scam Relief
            **Act on Special Measures Concerning Relief for Victims of Transfer Frauds (Act No. 133 of 2007)**

            ### 🚀 Live Production Deployment
            - 🌐 **Primary Web App**: **[https://reliefops.web.app](https://reliefops.web.app)**
            - 🌐 **Alternative CDN**: **[https://reliefops.firebaseapp.com](https://reliefops.firebaseapp.com)**
            - 📖 **Scenario Walkthrough & Guide**: **[frontend/walkthrough/README.md](frontend/walkthrough/README.md)**

            ---

            ### 🌟 Key Features & Capabilities
            - **In-App Interactive Demo Tour**: 6 guided real-world scenarios with 1-click role and state orchestration
            - **Multi-Bank Operations Center**: 5-bank tenant isolation (`bank_a` through `bank_e`) with zero cross-tenant leakage
            - **Rule D3 Human-in-the-Loop AI Vision**: Assisted OCR for Japanese Furikomi vouchers and police stamps with mandatory human operator acceptance
            - **Cross-Bank Fraud Syndicate Topology**: Graph visualization of shared suspect destination accounts across member banks with coordinated freeze simulation
            - **Citizen Self-Service Portal**: Public scam loss reporting, real-time 6-stage lifecycle progress tracker, and Bank Bluebook RAG assistant
            - **Regulatory Audit Ledger**: Immutable FSA-compliant audit trail with cryptographic integrity verification
